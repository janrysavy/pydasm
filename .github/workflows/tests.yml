name: Python tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - name: Run the decoder and frame regression suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Retain the exact tested Python sources and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pydasm-test-snapshot
          path: |
            src
            tests
            test-results.xml
          retention-days: 7
