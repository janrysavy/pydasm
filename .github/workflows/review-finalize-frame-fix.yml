name: Publish reviewed TP6 frame fix
on:
  push:
    branches: ['review/tp6-no-local-frames-20260925']
    paths: ['.github/workflows/review-finalize-frame-fix.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/tp6-no-local-frames-20260925
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest pyyaml
      - name: Apply the already-tested source transformations
        shell: python
        run: |
          from pathlib import Path
          import yaml
          workflow = yaml.safe_load(Path('.github/workflows/review-apply-frame-fix.yml').read_text())
          step = workflow['jobs']['apply']['steps'][2]
          assert step['name'] == 'Apply exact reviewed replacements and regression tests'
          exec(compile(step['run'], '<reviewed-frame-fix>', 'exec'))
      - name: Run all tests and publish only source changes
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q
          git config user.name 'Jan Ryšavý'
          git config user.email 'janrysavy@users.noreply.github.com'
          git add src/pydasm/frame.py tests/test_frame_no_locals.py
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m 'Recognize TP6 no-local BP epilogues and retain static-link evidence'
          git push origin HEAD:review/tp6-no-local-frames-20260925
