name: Apply reviewed TP6 frame fix
on:
  push:
    branches: ['review/tp6-no-local-frames-20260925']
    paths: ['.github/workflows/review-apply-frame-fix.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/tp6-no-local-frames-20260925
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply exact reviewed replacements and regression tests
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          p = Path('src/pydasm/frame.py')
          b = p.read_bytes()
          assert hashlib.sha1(b'blob ' + str(len(b)).encode() + b'\0' + b).hexdigest() == '70b7979c5e1910c460fd49d645c7c90f9f069e37'
          s = b.decode().replace('\r\n', '\n')
          changes = [
              ('    The range must be exactly the routine: the epilogue is recognised as\n    `mov sp,bp` / `pop bp` / `ret`, and a range that runs past the routine\'s end\n    would pick up the next one\'s epilogue instead.',
               '    The range must be exactly the routine: the epilogue is recognised as\n    `mov sp,bp` / `pop bp` / `ret`, or just `pop bp` / `ret` when no local\n    allocation was observed. A range past the routine\'s end could pick up\n    the next one\'s epilogue instead.'),
              ('        # Epilogue: `mov sp,bp` then `pop bp` then the return.\n',
               '        # TP6 omits `mov sp,bp` when the BP frame has no local allocation.\n        # An allocated frame still needs the observed SP reset before POP BP.\n'),
              ('            and before is not None\n            and before.mnemonic.name == "MOV"\n            and before.operand1_type.value is Register16.SP\n            and before.operand2_type.value is Register16.BP\n',
               '            and (\n                frame.frame_size in (None, 0)\n                or (\n                    before is not None\n                    and before.mnemonic.name == "MOV"\n                    and before.operand1_type.value is Register16.SP\n                    and before.operand2_type.value is Register16.BP\n                )\n            )\n'),
              ('        # reads up to `[bp+0xa]` is a routine handed four words and popping one,\n',
               '        # reads up to `[bp+0xa]` is a routine handed four words and popping two,\n'),
              ('        # convention, and it is the kind a declaration cannot express: the\n        # routine is handed more than it removes, so the caller cleans up the\n        # rest. Recorded rather than smoothed -- and it belongs in `notes` even\n',
               '        # convention: the routine is handed more than it removes, so the caller\n        # owns the remaining stack area (for example a TP6 string-result buffer).\n        # Recorded rather than smoothed -- and it belongs in `notes` even\n'),
          ]
          for old, new in changes:
              assert s.count(old) == 1, repr(old)
              s = s.replace(old, new)
          p.write_bytes(s.replace('\n', '\r\n').encode())
          Path('tests/test_frame_no_locals.py').write_text('''"""Stack-only TP6 epilogues must retain their calling-convention evidence."""
          import pytest
          from pydasm.frame import analyse_frame

          def frame(hex_bytes):
              code = bytes.fromhex(hex_bytes)
              return analyse_frame(code, 0, len(code))

          @pytest.mark.parametrize('ret,discipline,pops', [
              ('c3', 'near', 0), ('c20600', 'near', 6),
              ('cb', 'far', 0), ('ca0400', 'far', 4),
          ])
          def test_bp_frame_without_locals_needs_no_sp_reset(ret, discipline, pops):
              result = frame('55 89e5 5d ' + ret)
              assert result.has_bp_frame
              assert result.frame_size is None
              assert (result.return_discipline, result.pops) == (discipline, pops)

          def test_no_locals_nested_procedure_keeps_unread_static_link():
              result = frame('55 89e5 8b4608 3b4606 5d c20600')
              assert (result.return_discipline, result.pops) == ('near', 6)
              assert [(a.offset, a.width, a.accessed_width) for a in result.arguments] == [
                  (4, 2, 0), (6, 2, 2), (8, 2, 2)]
              assert any('hidden static link' in note for note in result.notes)

          def test_allocated_frame_still_requires_the_observed_sp_reset():
              result = frame('55 89e5 83ec02 5d c20600')
              assert result.frame_size == 2
              assert result.return_discipline is None
              assert result.pops is None

          def test_allocated_frame_with_sp_reset_still_works():
              result = frame('55 89e5 83ec02 89ec 5d c20600')
              assert (result.return_discipline, result.pops) == ('near', 6)

          def test_zero_allocation_is_a_no_locals_frame():
              result = frame('55 89e5 83ec00 5d cb')
              assert (result.return_discipline, result.pops) == ('far', 0)

          @pytest.mark.parametrize('code', ['55 89e5 58 c3', '5d c3', '55 89e5 c3'])
          def test_missing_frame_or_wrong_pop_does_not_invent_an_epilogue(code):
              result = frame(code)
              assert result.return_discipline is None
              assert result.pops is None
          ''')
      - run: python -m pip install pytest
      - name: Verify the changed sources before pushing
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: Commit the tested fix and remove this one-use workflow
        run: |
          rm .github/workflows/review-apply-frame-fix.yml
          git config user.name 'Jan Ryšavý'
          git config user.email 'janrysavy@users.noreply.github.com'
          git add src/pydasm/frame.py tests/test_frame_no_locals.py .github/workflows/review-apply-frame-fix.yml
          git diff --cached --check
          git commit -m 'Recognize TP6 no-local BP epilogues and retain static-link evidence'
          git push origin HEAD:review/tp6-no-local-frames-20260925
